services:
  - type: web
    name: line-stock-news-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_SCHEDULER
        value: false
      - key: TIMEZONE
        value: Asia/Taipei
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: stock-bot-db
          property: connectionString
      # Add these manually in Render Dashboard > Environment:
      # LINE_CHANNEL_ACCESS_TOKEN
      # LINE_CHANNEL_SECRET
      # GEMINI_API_KEY
      # Optional: CRON_SECRET

  - type: cron
    name: line-stock-news-daily-report
    runtime: python
    schedule: "30 23 * * *" # UTC 23:30 = Asia/Taipei 07:30
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scheduler.daily_job
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_SCHEDULER
        value: false
      - key: TIMEZONE
        value: Asia/Taipei
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: stock-bot-db
          property: connectionString
      # Add these manually in Render Dashboard > Environment:
      # LINE_CHANNEL_ACCESS_TOKEN
      # LINE_CHANNEL_SECRET
      # GEMINI_API_KEY

databases:
  - name: stock-bot-db
    databaseName: stock_bot
    user: stock_bot_user
